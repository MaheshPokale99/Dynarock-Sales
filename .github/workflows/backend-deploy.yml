name: Backend CI/CD (Cloud Build)
# GitHub is the gate for backend changes. Cloud Build runs only after every
# GitHub check passes on main, then builds and deploys the checked commit.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cloudbuild.yaml'
      - '.github/workflows/backend-deploy.yml'
      - '.gcloudignore'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cloudbuild.yaml'
      - '.github/workflows/backend-deploy.yml'
      - '.gcloudignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: dynarock-backend-2026
  REGION: asia-south1
  IMAGE: asia-south1-docker.pkg.dev/dynarock-backend-2026/dynarock/sales-api
  TRIGGER: dynarock-sales-api-deploy
  WORKLOAD_IDENTITY_PROVIDER: projects/1034702348498/locations/global/workloadIdentityPools/github-actions/providers/dynarock-sales
  SERVICE_ACCOUNT: dynarock-sales-github@dynarock-backend-2026.iam.gserviceaccount.com

jobs:
  checks:
    name: Format, lint, types, dead code & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm audit --omit=dev --audit-level=critical

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build backend image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=sales-api-image
          cache-to: type=gha,scope=sales-api-image,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: [checks, test, secrets, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Run Cloud Build for this commit
        shell: bash
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_id="$(gcloud builds triggers run "$TRIGGER" \
            --project="$PROJECT_ID" \
            --region=global \
            --sha="$BUILD_COMMIT_SHA" \
            --format=json | jq -r '.metadata.build.id // empty')"

          if [[ -z "$build_id" ]]; then
            echo "Cloud Build did not return a build ID."
            exit 1
          fi

          echo "Cloud Build $build_id is deploying commit $BUILD_COMMIT_SHA."
          echo "https://console.cloud.google.com/cloud-build/builds/$build_id?project=$PROJECT_ID"

          while true; do
            status="$(gcloud builds describe "$build_id" \
              --project="$PROJECT_ID" \
              --region=global \
              --format='value(status)')"

            case "$status" in
              SUCCESS)
                echo "Cloud Build completed successfully."
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build ended with status: $status"
                exit 1
                ;;
              *)
                echo "Cloud Build status: ${status:-unknown}; checking again in 10 seconds."
                sleep 10
                ;;
            esac
          done
