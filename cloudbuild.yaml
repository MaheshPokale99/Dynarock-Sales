# Cloud Run continuous deployment for dynarock-sales-api.
# Run by the Cloud Build trigger on every push to main that touches backend/ (deploy/gcp/trigger.yaml),
# and by deploy/gcp/deploy.sh for a manual deploy. The full service config lives here.
substitutions:
  _AR_HOSTNAME: asia-south1-docker.pkg.dev
  _AR_PROJECT_ID: dynarock-backend-2026
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: asia-south1
  _PLATFORM: managed
  _SERVICE_NAME: dynarock-sales-api
  _TRIGGER_ID: manual
  _API_DOMAIN: api.sales.dynarock.in
  _WEB_DOMAIN: sales.dynarock.in

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/dynarock-sales/$_SERVICE_NAME:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/dynarock-sales/$_SERVICE_NAME:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/dynarock-sales/$_SERVICE_NAME:$COMMIT_SHA'
      - '--labels'
      - 'managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID'
      - '--project'
      - '$_AR_PROJECT_ID'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - '$_PLATFORM'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      # Request-based billing: CPU is billed only while a request runs, and nothing when idle.
      # Gmail sync and follow-ups run on POST /internal/tick, called every minute by Cloud Scheduler (WORKER_MODE=cron).
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--cpu-throttling'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      # Only the load balancer (api.sales.dynarock.in) reaches the service; outbound goes through Cloud NAT (fixed IP for MongoDB Atlas).
      - '--ingress'
      - 'internal-and-cloud-load-balancing'
      - '--network'
      - 'dynarock-vpc'
      - '--subnet'
      - 'dynarock-run'
      - '--vpc-egress'
      - 'all-traffic'
      - '--port'
      - '8080'
      - '--service-account'
      - 'dynarock-sales-api@$_AR_PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - >-
        NODE_ENV=production,
        LOG_LEVEL=info,
        FRONTEND_ORIGIN=https://$_WEB_DOMAIN,
        API_PUBLIC_URL=https://$_API_DOMAIN,
        SESSION_TTL_DAYS=14,
        INVITE_TTL_DAYS=7,
        COOKIE_SECURE=true,
        BOOTSTRAP_ADMIN_NAME=Mahesh Pokale,
        BOOTSTRAP_ADMIN_EMAIL=operations@dynarock.in,
        MAILBOX_ADDRESS=sales@dynarock.in,
        GOOGLE_REDIRECT_URI=https://$_API_DOMAIN/api/v1/mailbox/oauth/callback,
        GMAIL_SYNC_INTERVAL_SECONDS=60,
        GEMINI_MODEL=gemini-3.1-flash-lite,
        RATE_LIMIT_PER_MINUTE=300,
        AUTH_RATE_LIMIT_PER_MINUTE=10,
        AI_RATE_LIMIT_PER_MINUTE=20,
        TRUST_PROXY=true,
        USER_DAILY_SEND_LIMIT=200,
        MAILBOX_DAILY_SEND_LIMIT=1500,
        AI_DAILY_CALL_LIMIT=1500,
        WORKER_MODE=cron
      - '--set-secrets'
      - >-
        MONGODB_URI=dynarock-sales-mongodb-uri:latest,
        ENCRYPTION_KEY=dynarock-sales-encryption-key:latest,
        GOOGLE_CLIENT_ID=dynarock-sales-google-client-id:latest,
        GOOGLE_CLIENT_SECRET=dynarock-sales-google-client-secret:latest,
        GEMINI_API_KEY=dynarock-sales-gemini-api-key:latest,
        BOOTSTRAP_ADMIN_PASSWORD=dynarock-sales-bootstrap-admin-password:latest,
        CRON_SECRET=dynarock-sales-cron-secret:latest
      - '--quiet'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/dynarock-sales/$_SERVICE_NAME:$COMMIT_SHA'

serviceAccount: 'projects/$_AR_PROJECT_ID/serviceAccounts/dynarock-sales-build@$_AR_PROJECT_ID.iam.gserviceaccount.com'

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
