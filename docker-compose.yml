# Full stack: `docker compose --profile app up --build`.
# Required in your shell or a root .env file: MONGO_ROOT_PASSWORD and BOOTSTRAP_ADMIN_PASSWORD (16+ characters).
services:
    mongo:
        image: mongo:8
        environment:
            MONGO_INITDB_ROOT_USERNAME: dynarock
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
        # Only reachable from this machine; the API talks to it over the compose network.
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongodata:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 3s
            retries: 10

    api:
        profiles: ["app"]
        build: ./backend
        depends_on:
            mongo:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 5000
            MONGODB_URI: ${MONGODB_URI:-mongodb://dynarock:${MONGO_ROOT_PASSWORD}@mongo:27017/dynarock_sales?authSource=admin}
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
            API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5000}
            BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dynarock.in}
            BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD (16+ characters)}
            MAILBOX_ADDRESS: ${MAILBOX_ADDRESS:-sales@dynarock.in}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
            TRUST_PROXY: ${TRUST_PROXY:-false}
        ports:
            - "5000:5000"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/readyz >/dev/null || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 10

    web:
        profiles: ["app"]
        build:
            context: ./frontend
            args:
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "3000:3000"

volumes:
    mongodata:
