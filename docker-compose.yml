services:
    mongo:
        image: mongo:8
        ports:
            - "27017:27017"
        volumes:
            - mongodata:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 5s
            timeout: 3s
            retries: 10

    api:
        profiles: ["app"]
        build: ./backend
        depends_on:
            mongo:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 5000
            MONGODB_URI: mongodb://mongo:27017/dynarock_sales
            FRONTEND_ORIGIN: http://localhost:3000
            COOKIE_SECURE: "false"
            BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@dynarock.in}
            BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
        ports:
            - "5000:5000"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/readyz >/dev/null || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 10

    web:
        profiles: ["app"]
        build:
            context: ./frontend
            args:
                NEXT_PUBLIC_API_URL: http://localhost:5000
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "3000:3000"

volumes:
    mongodata:
